name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts and S1–S3 producer checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned contract tooling
        run: |
          npm install --global pnpm@10.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-contracts.txt
      - name: Typecheck contracts
        run: pnpm run typecheck
      - name: Validate contracts and synthetic handshake
        run: PATH="$PWD/.venv/bin:$PATH" pnpm run test:contracts
      - name: Test S1 runtime boundaries and cross-language identity
        run: pnpm run test:foundation
      - name: Prepare digest-pinned static parser runtime
        run: docker pull python:3.13.18-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f
      - name: Verify static parser resource boundary
        run: node scripts/check-parser-boundary.mjs .heurisko/ci-parser-boundary.json
      - name: Test S2 archive, network, replay and CLI boundaries
        run: pnpm run test:s2
      - name: Test S3 exact npm, source candidates and provenance boundary
        run: pnpm run test:s3
      - name: Verify retained S3 corpus offline
        run: node scripts/verify-s3-capture.mjs examples/s3/current --historical

      - name: Test audit repairs and late parser creation
        run: pnpm run test:audit
      - name: Verify earlier audit replay as historical evidence
        run: node scripts/verify-s3-capture.mjs examples/audit-fixes/current --historical
      - name: Verify host-readable parser checkpoint replay
        run: node scripts/verify-s3-capture.mjs examples/handoff/current

  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify research snapshot checksums
        run: cd docs/Heurisko_Research && sha256sum -c SHA256SUMS.txt
      - name: Check local Markdown links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re
          import sys

          files = [Path('README.md'), Path('AGENTS.md')]
          files.extend(sorted(Path('docs').rglob('*.md')))
          files.extend(sorted(Path('examples').rglob('*.md')))
          issues = []
          pattern = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          for source in files:
              for raw in pattern.findall(source.read_text(errors='replace')):
                  target = unquote(raw.strip().split()[0].strip('<>'))
                  if not target or target.startswith(('http://', 'https://', 'mailto:', 'data:')):
                      continue
                  path, _, anchor = target.partition('#')
                  destination = (source.parent / path).resolve() if path else source.resolve()
                  if not destination.exists():
                      issues.append(f'{source}: missing link target {target}')
                      continue
                  if anchor and destination.suffix.lower() == '.md':
                      headings = []
                      for line in destination.read_text(errors='replace').splitlines():
                          match = re.match(r'^#{1,6}\s+(.+?)\s*#*$', line)
                          if match:
                              heading = re.sub(r'[^\w -]', '', match.group(1).lower()).strip().replace(' ', '-')
                              headings.append(heading)
                      if anchor not in headings:
                          issues.append(f'{source}: missing heading anchor #{anchor} in {target}')
          if issues:
              print('\n'.join(issues))
              sys.exit(1)
          print(f'Checked relative Markdown links in {len(files)} files.')
          PY
