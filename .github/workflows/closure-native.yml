name: Source-bound closure native validation

# Feature publication and native CI authorized by the owner on 2 November 2026.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Prepare exact tools and runtime images
        run: |
          npm install --global pnpm@10.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-contracts.txt
          docker --host unix:///var/run/docker.sock pull python:3.13.18-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f
          docker --host unix:///var/run/docker.sock pull --platform=linux/amd64 node:22.23.4-bookworm-slim@sha256:9f0dde62d10e7ff7a310ecaebd66225f6b46c17e6cb778449a77b05d3541bea2
      - name: Prepare exact supported source and enforce native admission
        run: |
          .venv/bin/python scripts/prepare-source-selection.py .heurisko/closure-source
          .venv/bin/python scripts/run-closure-validation.py .heurisko/closure-native --manifest .heurisko/closure-source/manifest.json
      - name: Retain actual commands and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: closure-native-linux-amd64-${{ github.event.pull_request.head.sha || github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            .heurisko/closure-source/manifest.json
            .heurisko/closure-source/validation.json
            .heurisko/closure-native/*.json
            .heurisko/closure-native/*.log
            .heurisko/closure-native/production-worker/*.json
            .heurisko/closure-native/controlled-worker/*.json
            .heurisko/closure-native/controlled-fixtures/*
            .heurisko/closure-native/controlled-runtime/CONTROLLED-TEST-ONLY.json
            .heurisko/closure-native/controlled-runtime/packages/core/runtime/trust-bootstrap.json
            .heurisko/closure-native/controlled-runtime/packages/core/dist/verifier-worker.cjs
            .heurisko/closure-native/controlled-runtime/packages/core/dist/trust.js
            .heurisko/closure-native/controlled-runtime/packages/core/dist/trust-profiles.js
            .heurisko/closure-native/controlled-application/**
            .heurisko/closure-native/real-application/**
