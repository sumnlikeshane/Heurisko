# Example only: merge into the existing event-mandated CI after pinning
# action SHAs, a pnpm packageManager version, and pnpm-lock.yaml.
name: Heurisko contract validation (additive example)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-contracts.txt
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm run typecheck
      - run: corepack pnpm run test:contracts
